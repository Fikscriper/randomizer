<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="./statuse/collorized.css">
    <link rel="stylesheet" href="./statuse/global.css">
    <link rel="stylesheet" href="./statuse/burger_menu.css">
    <link rel="stylesheet" href="./statuse/wheel.css"> 
    <link rel="stylesheet" href="./statuse/dice.css">
    <title>Колесо фортуны</title>
</head>
  
<body class="main">

    <header style="padding: 50px;">
        <input id="burger" type="checkbox" />
        <label for="burger">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <nav>
            <a href="./main.html" class="link">Main</a>
            <ul>
                <li><a class="link" href="./rand_num.html">Рандомайзер чисел</a></li>
                <li><a class="link" href="./rand_wheel.html">Колесо фортуны</a></li>
                <li><a class="link" href="./rand_coin.html">Орел и Решка</a></li>
                <li><a class="link" href="./rand_dice.html">Кости</a></li>
            </ul>
        </nav>
    </header>
    
    <div class="wheel-page">
        <section class="wheel_section">
            <fieldset class="ui-wheel-of-fortune" id="wheelFortune">
                <ul id="wheelList"></ul>
                <button type="button" id="spinButton">КРУТИТЬ</button>
            </fieldset>
        </section>

        <div class="wheel-editor">
            <h3 style="margin:0 0 15px; color:#fff;">✏️ Редактировать сектора</h3>
            <div id="itemsEditor" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button id="addItemBtn" class="button" style="margin:0;">➕ Добавить сектор</button>
                <button id="removeLastBtn" class="button" style="margin:0; background:#b71c1c;">➖ Удалить последний</button>
                <button id="resetWheelBtn" class="button" style="margin:0; background:#5d4a0e;">↺ Сбросить (12)</button>
            </div>
            <div id="spinResult" style="margin-top:20px; font-size:24px; text-align:center; color:#ffd966; min-height:3rem;"></div>
        </div>
    </div>

    <footer>
        <p>Контакты: Fiks.criper@gmail.com</p>
    </footer>

    <script src="js/wheel.js"></script>
</body>
</html>
