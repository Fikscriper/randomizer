<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎡 Кастомное колесо фортуны</title>
  <style>
    /* === wheel.css (адаптировано) === */
    :where(.ui-wheel-of-fortune) {
      --_items: 6;
      all: unset;
      aspect-ratio: 1 / 1;
      container-type: inline-size;
      direction: ltr;
      display: grid;
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    .ui-wheel-of-fortune::after {
      aspect-ratio: 1 / cos(30deg);
      background-color: crimson;
      clip-path: polygon(50% 100%, 100% 0, 0 0);
      content: "";
      height: 4cqi;
      position: absolute;
      place-self: start center;
      scale: 1.4;
      z-index: 2;
    }
    .ui-wheel-of-fortune > * {
      position: absolute;
    }
    .ui-wheel-of-fortune button {
      aspect-ratio: 1 / 1;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      font-size: 5cqi;
      place-self: center;
      width: 20cqi;
      background: #195210;
      background: linear-gradient(358deg, rgba(25, 82, 16, 1) 0%, rgba(36, 115, 69, 1) 57%);
      color: white;
      text-shadow: 1px 1px 15px rgba(0,0,0,0.5);
      text-align: center;
      z-index: 3;
      transition: 0.2s;
    }
    .ui-wheel-of-fortune button:hover {
      background: #2a7a1f;
      scale: 1.02;
    }
    .ui-wheel-of-fortune ul {
      all: unset;
      clip-path: inset(0 0 0 0 round 50%);
      display: grid;
      inset: 0;
      place-content: center start;
    }
    .ui-wheel-of-fortune li {
      align-content: center;
      aspect-ratio: 1 / calc(2 * tan(180deg / var(--_items)));
      background: #195210;
      background: linear-gradient(90deg, rgba(25, 82, 16, 1) 0%, rgba(34, 133, 75, 1) 100%);
      clip-path: polygon(0% 0%, 100% 50%, 0% 100%);
      display: grid;
      font-size: 4cqi;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 5px black;
      grid-area: 1 / -1;
      padding-left: 1.5ch;
      rotate: calc(360deg / var(--_items) * calc(var(--_idx) - 1));
      transform-origin: center right;
      user-select: none;
      width: 50cqi;
    }
    /* Нумерация индексов через CSS (динамически обновляется JS) */
    .ui-wheel-of-fortune li:nth-of-type(1) { --_idx: 1; }
    .ui-wheel-of-fortune li:nth-of-type(2) { --_idx: 2; }
    .ui-wheel-of-fortune li:nth-of-type(3) { --_idx: 3; }
    .ui-wheel-of-fortune li:nth-of-type(4) { --_idx: 4; }
    .ui-wheel-of-fortune li:nth-of-type(5) { --_idx: 5; }
    .ui-wheel-of-fortune li:nth-of-type(6) { --_idx: 6; }
    .ui-wheel-of-fortune li:nth-of-type(7) { --_idx: 7; }
    .ui-wheel-of-fortune li:nth-of-type(8) { --_idx: 8; }
    .ui-wheel-of-fortune li:nth-of-type(9) { --_idx: 9; }
    .ui-wheel-of-fortune li:nth-of-type(10) { --_idx: 10; }
    .ui-wheel-of-fortune li:nth-of-type(11) { --_idx: 11; }
    .ui-wheel-of-fortune li:nth-of-type(12) { --_idx: 12; }
    /* Добавим ещё несколько для гибкости */
    .ui-wheel-of-fortune li:nth-of-type(13) { --_idx: 13; }
    .ui-wheel-of-fortune li:nth-of-type(14) { --_idx: 14; }
    .ui-wheel-of-fortune li:nth-of-type(15) { --_idx: 15; }
    .ui-wheel-of-fortune li:nth-of-type(16) { --_idx: 16; }
    .ui-wheel-of-fortune li:nth-of-type(17) { --_idx: 17; }
    .ui-wheel-of-fortune li:nth-of-type(18) { --_idx: 18; }
    .ui-wheel-of-fortune li:nth-of-type(19) { --_idx: 19; }
    .ui-wheel-of-fortune li:nth-of-type(20) { --_idx: 20; }

    /* === Стили интерфейса === */
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1e2c;
      color: #eee;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    header {
      width: 100%;
      padding: 20px;
      background: #0f1219;
      border-radius: 20px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
    }
    .burger-menu {
      /* стили бургера (можно оставить как есть) */
    }
    nav a, nav li a {
      color: #aaccff;
      text-decoration: none;
    }
    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      width: 100%;
      max-width: 800px;
    }
    .wheel-container {
      background: #252b3d;
      padding: 30px;
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .controls-panel {
      background: #252b3d;
      padding: 25px;
      border-radius: 30px;
      width: 100%;
    }
    .item-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .item-entry {
      display: flex;
      align-items: center;
      background: #0f1219;
      border-radius: 30px;
      padding: 5px 10px;
    }
    .item-entry input {
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
      padding: 8px;
      width: 100px;
      outline: none;
      border-bottom: 1px solid #3a4a6a;
    }
    .item-entry button {
      background: #c0392b;
      border: none;
      color: white;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 5px;
    }
    .add-btn, .apply-btn, .clear-btn {
      background: #2e7d32;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 10px;
      transition: 0.2s;
    }
    .add-btn:hover, .apply-btn:hover { background: #1b5e20; }
    .clear-btn { background: #b71c1c; }
    .clear-btn:hover { background: #8b0000; }
    .result-area {
      margin-top: 20px;
      font-size: 24px;
      text-align: center;
      font-weight: bold;
      color: #ffd966;
    }
    footer {
      margin-top: 40px;
      color: #aaa;
    }
  </style>
</head>
<body>

<header>
  <!-- Пример простого меню (бургер оставим для демо) -->
  <input id="burger" type="checkbox" style="display:none;" />
  <label for="burger" style="cursor:pointer; margin-right:20px;">☰</label>
  <nav>
    <a href="./main.html" class="link" style="margin-right:20px;">Main</a>
    <ul style="display:flex; gap:15px; list-style:none; padding:0;">
      <li><a class="link" href="./rand_num.html">Числа</a></li>
      <li><a class="link" href="./rand_wheel.html">Колесо</a></li>
      <li><a class="link" href="./rand_coin.html">Монета</a></li>
      <li><a class="link" href="./rand_dice.html">Кости</a></li>
    </ul>
  </nav>
</header>

<section class="wheel-section">
  <div class="wheel-container">
    <div class="ui-wheel-of-fortune" id="wheelOfFortune">
      <ul id="wheelList">
        <!-- элементы будут генерироваться JS -->
      </ul>
      <button type="button" id="spinButton">🎲 КРУТИТЬ</button>
    </div>
  </div>

  <div class="controls-panel">
    <h3 style="margin-top:0;">✏️ Редактор секторов</h3>
    <div id="itemListContainer" class="item-list">
      <!-- динамические поля ввода -->
    </div>
    <div style="display:flex; flex-wrap:wrap; gap:10px;">
      <button class="add-btn" id="addItemBtn">➕ Добавить сектор</button>
      <button class="apply-btn" id="applyChangesBtn">🔄 Обновить колесо</button>
      <button class="clear-btn" id="resetDefaultBtn">↺ Сбросить</button>
    </div>
    <div class="result-area" id="resultDisplay">
      Жми «КРУТИТЬ»
    </div>
  </div>
</section>

<footer>
  <p>Контакты: Fiks.criper@gmail.com</p>
</footer>

<script>
  (function(){
    "use strict";

    // ---------- DOM элементы ----------
    const wheel = document.getElementById('wheelOfFortune');
    const wheelList = document.getElementById('wheelList');
    const spinBtn = document.getElementById('spinButton');
    const itemListDiv = document.getElementById('itemListContainer');
    const addBtn = document.getElementById('addItemBtn');
    const applyBtn = document.getElementById('applyChangesBtn');
    const resetBtn = document.getElementById('resetDefaultBtn');
    const resultDisplay = document.getElementById('resultDisplay');

    // ---------- Состояние ----------
    let items = ['$1000', '$2000', '$3000', '$4000', '$5000', '$6000']; // начальные 6 секторов
    let currentRotation = 0; // в градусах
    let isSpinning = false;

    // ---------- Вспомогательные функции ----------
    function renderEditor() {
      // Создаём поля ввода для каждого элемента
      itemListDiv.innerHTML = '';
      items.forEach((value, index) => {
        const entry = document.createElement('div');
        entry.className = 'item-entry';
        entry.dataset.index = index;

        const input = document.createElement('input');
        input.type = 'text';
        input.value = value;
        input.addEventListener('input', (e) => {
          items[index] = e.target.value;
        });

        const delBtn = document.createElement('button');
        delBtn.textContent = '✕';
        delBtn.title = 'Удалить сектор';
        delBtn.addEventListener('click', () => {
          if (items.length <= 1) {
            alert('Должен быть хотя бы один сектор!');
            return;
          }
          items.splice(index, 1);
          renderEditor();
          rebuildWheel();
        });

        entry.appendChild(input);
        entry.appendChild(delBtn);
        itemListDiv.appendChild(entry);
      });
    }

    // Перестроить колесо (обновить список <li> и CSS переменную)
    function rebuildWheel() {
      const count = items.length;
      wheel.style.setProperty('--_items', count);

      // Очищаем список
      wheelList.innerHTML = '';

      // Создаём li для каждого значения
      items.forEach((text) => {
        const li = document.createElement('li');
        li.textContent = text;
        wheelList.appendChild(li);
      });

      // Применяем текущий поворот
      wheelList.style.transform = `rotate(${currentRotation}deg)`;
    }

    // Сбросить к значениям по умолчанию
    function resetToDefault() {
      items = ['$1000', '$2000', '$3000', '$4000', '$5000', '$6000', '$7000', '$8000', '$9000', '$10000', '$11000', '$12000'];
      currentRotation = 0; // сброс поворота
      renderEditor();
      rebuildWheel();
      resultDisplay.textContent = 'Жми «КРУТИТЬ»';
    }

    // Вращение колеса
    function spinWheel() {
      if (isSpinning) return;
      if (items.length === 0) {
        alert('Нет секторов! Добавьте хотя бы один.');
        return;
      }

      isSpinning = true;
      spinBtn.disabled = true;

      // Выбираем случайный индекс
      const randomIndex = Math.floor(Math.random() * items.length);
      const segmentAngle = 360 / items.length;

      // Рассчитываем целевой угол: чтобы указатель показывал на центр выбранного сектора
      // В нашей вёрстке указатель (::after) находится сверху по центру (0°).
      // Сектора нумеруются по часовой стрелке? В CSS rotate: calc(360deg / var(--_items) * calc(var(--_idx) - 1))
      // это вращает каждый li от 0° для первого сектора. Но при transform-origin: center right;
      // первый сектор (--_idx:1) начинается от правой границы и идёт против часовой? 
      // На практике колесо нарисовано так, что сектор с индексом 1 находится справа и идёт вниз.
      // Указатель сверху — значит, нам нужен сектор, который находится под указателем.
      // Проще всего подобрать коррекцию экспериментально. Обычно смещение -90deg для первого элемента.
      // Учтём: при rotate(0) первый li расположен так, что его левый край (вершина) смотрит вправо, а сам сектор занимает область от 0° до segmentAngle.
      // Указатель находится на 0° (верх). Нам нужно, чтобы сектор с индексом idx оказался под указателем.
      // Смещение: если повернуть колесо на (360 - (idx-1)*segmentAngle - segmentAngle/2) градусов, центр idx-го сектора окажется наверху.
      // Плюс возможна начальная фаза из-за clip-path. Подберём эмпирически.

      // Формула: targetRotation = (360 - (randomIndex * segmentAngle) - segmentAngle/2) % 360;
      let targetBase = (360 - (randomIndex * segmentAngle) - segmentAngle / 2) % 360;
      
      // Добавляем несколько полных оборотов для эффекта
      const spins = 5; // количество полных оборотов
      const fullTurns = 360 * spins;
      const newRotation = currentRotation + fullTurns + targetBase;

      // Анимация через CSS transition
      wheelList.style.transition = 'transform 3s cubic-bezier(0.25, 0.1, 0.15, 1)';
      wheelList.style.transform = `rotate(${newRotation}deg)`;

      // Сохраняем итоговый угол (нормализованный)
      const finalAngle = newRotation % 360;
      currentRotation = finalAngle;

      // По окончании анимации выводим результат
      const onFinish = () => {
        wheelList.style.transition = '';
        isSpinning = false;
        spinBtn.disabled = false;
        resultDisplay.textContent = `🎉 Выпало: ${items[randomIndex]} 🎉`;
        wheelList.removeEventListener('transitionend', onFinish);
      };

      wheelList.addEventListener('transitionend', onFinish, { once: true });
    }

    // ---------- Инициализация ----------
    function init() {
      // Начальные значения (12 секторов, как в оригинале)
      items = ['$1000', '$2000', '$3000', '$4000', '$5000', '$6000', '$7000', '$8000', '$9000', '$10000', '$11000', '$12000'];
      renderEditor();
      rebuildWheel();

      // Обработчики
      addBtn.addEventListener('click', () => {
        items.push('Новое');
        renderEditor();
        rebuildWheel();
      });

      applyBtn.addEventListener('click', () => {
        // Просто перестраиваем из текущего items (уже обновлён через input)
        rebuildWheel();
        resultDisplay.textContent = 'Колесо обновлено';
      });

      resetBtn.addEventListener('click', resetToDefault);

      spinBtn.addEventListener('click', spinWheel);
    }

    init();
  })();
</script>

</body>
</html>
